<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ozon · Цены vs конкуренты</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#172039;--muted:#6d7690;--line:#e5e9f2;--blue:#1267ef;--green:#0f9f70;--red:#df4657;--shadow:0 7px 24px rgba(29,43,76,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.42 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}.head{max-width:1100px;margin:auto;padding:13px 22px;display:flex;align-items:center;gap:13px}.logo{width:38px;height:38px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center;font:bold 19px Arial}.title{font-size:18px;font-weight:780}.sub{color:var(--muted);font-size:12px}.updated{margin-left:auto;color:var(--muted);font-size:12px;text-align:right}.updated b{display:block;color:var(--ink);font-size:13px}.back{color:var(--blue);text-decoration:none;font-weight:650;font-size:13px}
main{max-width:1100px;margin:auto;padding:18px 22px 50px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.kpi{padding:15px;background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.kname{font-size:12px;color:var(--muted)}.kval{font-size:24px;font-weight:780;margin:8px 0 4px}
.toolbar{padding:12px 15px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:15px}select{font:inherit;border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);margin-top:14px;overflow:hidden}
.card>header{position:static;padding:14px 16px 8px;border:0}.lbl{display:inline-block;font-size:11px;font-weight:780;letter-spacing:.05em;color:#075dcc;background:#edf4ff;border-radius:999px;padding:3px 9px}
.card h3{margin:8px 0 4px;font-size:16px}.cap{color:var(--muted);font-size:12px;padding:0 16px 10px}
table{border-collapse:collapse;width:100%;table-layout:fixed}th,td{padding:9px 12px;border-bottom:1px solid #edf0f5;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}th{background:#f8fafc;color:var(--muted);font-size:11px;font-weight:650;text-align:right}th:first-child,td:first-child{text-align:left}.me td{background:#eef4ff}.cheap td{background:#eaf9f3}.n{font:650 14px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.d{display:block;font-size:10px;font-weight:700;min-height:12px}.up{color:var(--red)}.down{color:var(--green)}.mark{display:inline-block;min-width:28px;text-align:center;font-size:10px;font-weight:800;border-radius:5px;padding:1px 5px;margin-right:6px}.me .mark{background:#dce9ff;color:#075dcc}.them .mark{background:#fff1e4;color:#845705}
.empty{text-align:center;padding:32px;color:var(--muted)}.notice{padding:12px 14px;border-radius:11px;background:#eaf9f3;color:#087a55;border:1px solid #bfead9;margin-bottom:12px}
@media(max-width:720px){.kpis{grid-template-columns:1fr 1fr}main{padding:12px 9px 40px}.head{padding-left:10px;padding-right:10px}}
</style>
</head>
<body>
<header><div class="head"><div class="logo">₽</div><div><div class="title">Ozon · сравнение цен</div><div class="sub">Только цена. Снимок раз в час из кабинета, те же пары что на вкладке Конкуренты</div></div><div class="updated" id="updated">Загрузка…</div></div></header>
<main>
<div class="notice" id="note">Каждая карточка: наша цена и все конкуренты, дешёвый сверху. Δ — к нашей цене.</div>
<div class="kpis" id="kpis"></div>
<div class="toolbar"><select id="sku"><option value="">Все наши артикулы</option></select><a class="back" href="./">← оцифровка</a></div>
<div id="pairs"></div>
</main>
<script>
const $=s=>document.querySelector(s);
function rub(v){if(v==null||!isFinite(v))return '—';return Math.round(v)+' ₽'}
function signed(v){if(v==null||!isFinite(v))return '';const n=Math.round(v);return (n>0?'+':'')+n}
function render(d){
  const q=d.quality||{};
  $('#updated').innerHTML=`<b>Снимок ${d.hour||'—'}</b>${new Date(d.generated_at).toLocaleString('ru-RU',{timeZone:'Europe/Moscow'})}`;
  $('#kpis').innerHTML=[
    ['Наших SKU',q.pairs||0,'по карте пар'],
    ['С ценой',q.with_price||0,'карточек кабинета'],
    ['Они дешевле',q.they_cheaper||0,'к нашей цене'],
    ['Они дороже',q.they_dearer||0,'к нашей цене']
  ].map(x=>`<article class="kpi"><div class="kname">${x[0]}</div><div class="kval">${x[1]}</div><div class="sub">${x[2]}</div></article>`).join('');
  const all=d.pairs||[];
  const sel=$('#sku');
  if(sel.options.length<=1)sel.innerHTML='<option value="">Все наши артикулы</option>'+all.map(p=>`<option value="${p.sku}">${p.label||p.offer_id||p.sku}</option>`).join('');
  const pick=sel.value, pairs=pick?all.filter(p=>String(p.sku)===pick):all;
  $('#pairs').innerHTML=pairs.map(p=>{
    const rows=(p.rows||[]).map(r=>{
      const delta=r.who==='МЫ'?'':(r.delta==null?'':`<span class="${r.delta<0?'down':'up'}">${signed(r.delta)}</span>`);
      const chg=r.changed==null?'':`<span class="d ${r.changed<0?'down':'up'}">${signed(r.changed)} к прошлому часу</span>`;
      return `<tr class="${r.who==='МЫ'?'me':''} ${r.cheapest?'cheap':''}"><td><span class="mark">${r.who}</span>${r.seller||r.name||r.sku}<div class="sub">${r.sku}</div></td><td><span class="n">${rub(r.price)}</span>${chg}</td><td>${delta||'—'}</td></tr>`;
    }).join('');
    const min=p.market_min==null?'—':rub(p.market_min);
    const gap=p.our_price!=null&&p.market_min!=null?signed(p.our_price-p.market_min)+' к мин. рынка': '';
    return `<article class="card"><header><span class="lbl">${p.label||p.offer_id||p.sku}</span><h3>${p.name||p.offer_id||p.sku}</h3></header><p class="cap">мы ${rub(p.our_price)} · минимум ${min} ${gap}</p><table><colgroup><col style="width:46%"><col style="width:27%"><col style="width:27%"></colgroup><thead><tr><th>Кто</th><th>Цена</th><th>Δ к нам</th></tr></thead><tbody>${rows}</tbody></table></article>`;
  }).join('')||'<div class="empty">Нет пар</div>';
}
fetch('prices.json?'+Date.now()).then(r=>r.json()).then(d=>{window.DATA=d;render(d);$('#sku').onchange=()=>render(DATA)}).catch(e=>{$('#updated').textContent='Нет prices.json';$('#pairs').innerHTML='<div class="empty">'+e.message+'</div>'});
</script>
</body>
</html>
