<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ozon · Чистая прибыль</title>
  <style>
    :root{--bg:#f4f6fb;--card:#fff;--ink:#17213a;--muted:#6d7690;--line:#e5e9f2;--blue:#1267ef;--green:#12a575;--red:#e24957;--amber:#e59416;--shadow:0 8px 28px rgba(29,43,76,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}.head{max-width:1440px;margin:auto;padding:15px 24px;display:flex;align-items:center;gap:14px}.logo{width:38px;height:38px;border-radius:12px;background:var(--blue);display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px}.title{font-size:19px;font-weight:750}.sub{color:var(--muted);font-size:12px}.updated{margin-left:auto;color:var(--muted);font-size:12px}
    main{max-width:1440px;margin:auto;padding:22px 24px 50px}.toolbar,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.toolbar{padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:15px}input,button{font:inherit;border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 11px;color:var(--ink)}button{cursor:pointer}button:hover,.preset.active{border-color:#a9c6fa;background:#edf4ff;color:#075dcc}.dates{display:flex;align-items:center;gap:7px}.quality{margin-left:auto;font-size:12px;border-radius:20px;padding:7px 10px;background:#eaf9f3;color:#087a55}.quality.bad{background:#fff1f2;color:#bc263a}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.kpi{padding:17px;min-height:126px}.kpi-name{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}.kpi-value{font-size:27px;font-weight:780;margin:10px 0 6px;letter-spacing:-.5px}.delta{font-size:12px}.up{color:var(--green)}.down{color:var(--red)}.neutral{color:var(--muted)}
    .section-grid{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:12px}.panel{padding:18px}.panel h2{font-size:15px;margin:0 0 15px}.chart{height:265px;position:relative}.chart svg{width:100%;height:100%;overflow:visible}.axis{stroke:#e7eaf1;stroke-width:1}.area{fill:url(#grad)}.line{fill:none;stroke:var(--blue);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.zero{stroke:#bdc4d2;stroke-dasharray:4 5}.tick{fill:#8a92a6;font-size:10px}
    .breakdown{display:grid;gap:14px}.bar-head{display:flex;justify-content:space-between;margin-bottom:5px}.bar-track{height:8px;border-radius:99px;background:#eef1f6;overflow:hidden}.bar-fill{height:100%;border-radius:99px;background:var(--blue)}.bar:nth-child(2) .bar-fill{background:#7849d6}.bar:nth-child(3) .bar-fill{background:#ef8a28}.bar:nth-child(4) .bar-fill{background:#32a989}.bar:nth-child(5) .bar-fill{background:#9aa2b3}
    .table-card{margin-top:12px;overflow:hidden}.table-head{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.table-head h2{font-size:15px;margin:0}.scroll{overflow:auto;max-height:520px}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:right;padding:12px 14px;border-bottom:1px solid #eef0f5;white-space:nowrap}th{position:sticky;top:0;background:#f9fafc;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;z-index:1}th:first-child,td:first-child{text-align:left}.product{display:flex;gap:10px;align-items:center;max-width:420px}.product img{width:38px;height:38px;border-radius:8px;object-fit:cover;background:#eef1f6}.pname{overflow:hidden;text-overflow:ellipsis}.offer{font-size:11px;color:var(--muted)}.pos{color:var(--green)}.neg{color:var(--red)}
    .stocks{margin-top:12px}.stock-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stock{border:1px solid var(--line);border-radius:13px;padding:14px}.stock-top{display:flex;justify-content:space-between;gap:10px}.stock strong{font-size:13px}.badge{font-size:11px;border-radius:20px;padding:3px 7px;background:#fff4df;color:#9c6205;height:max-content}.stock-metric{font-size:25px;font-weight:750;margin:10px 0 4px}.stock small{color:var(--muted)}.empty{padding:35px;text-align:center;color:var(--muted)}
    details{margin-top:12px}.method{padding:16px 18px}summary{cursor:pointer;font-weight:650}.method-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:13px}.formula{background:#f7f9fc;border-radius:10px;padding:11px}.formula b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
    .alert{display:none;background:#fff0f2;color:#9c2031;border:1px solid #ffcbd2;border-radius:12px;padding:12px 15px;margin-bottom:12px}.alert.show{display:block}
    @media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.section-grid{grid-template-columns:1fr}.stock-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){main{padding:14px 10px 35px}.head{padding:11px}.updated{display:none}.grid{grid-template-columns:1fr 1fr;gap:8px}.kpi{min-height:105px;padding:13px}.kpi-value{font-size:21px}.stock-grid{grid-template-columns:1fr}.method-grid{grid-template-columns:1fr}.dates{width:100%}.dates input{width:46%}.quality{margin-left:0}.chart{height:220px}}
  </style>
</head>
<body>
<header><div class="head"><div class="logo">O</div><div><div class="title">Ozon · Оцифровка</div><div class="sub">Чистая прибыль и поставки по данным Seller API</div></div><div class="updated" id="updated">Загрузка…</div></div></header>
<main>
  <div class="alert" id="alert"></div>
  <div class="toolbar">
    <div class="dates"><input type="date" id="from"><span>—</span><input type="date" id="to"></div>
    <button class="preset" data-days="7">7 дней</button><button class="preset" data-days="30">30 дней</button><button class="preset" data-days="mtd">Месяц</button><button class="preset" data-days="all">Всё</button>
    <div class="quality" id="quality">Проверка данных</div>
  </div>
  <section class="grid" id="kpis"></section>
  <section class="section-grid">
    <div class="card panel"><h2>Чистая прибыль по дням</h2><div class="chart" id="chart"></div></div>
    <div class="card panel"><h2>Структура расходов</h2><div class="breakdown" id="breakdown"></div></div>
  </section>
  <section class="card table-card">
    <div class="table-head"><h2>Рентабельность товаров</h2><span class="sub" id="skuCount"></span></div>
    <div class="scroll"><table><thead><tr><th>Товар</th><th>Штук</th><th>Продажи</th><th>Выплата</th><th>Себестоимость</th><th>Прибыль</th><th>Маржа</th></tr></thead><tbody id="skuRows"></tbody></table></div>
  </section>
  <section class="card panel stocks"><h2>Куда поставить товар · цель 30 дней</h2><div class="stock-grid" id="stocks"></div></section>
  <details class="card method"><summary>Как считаются показатели</summary><div class="method-grid" id="formulas"></div></details>
</main>
<script>
const fmt=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});const money=v=>v==null?'—':fmt.format(v)+' ₽';const pct=v=>v==null?'—':(v>=0?'+':'')+v.toFixed(2)+'%';
let DATA=null;
const $=s=>document.querySelector(s), sum=(rows,key)=>rows.reduce((a,r)=>a+(Number(r[key])||0),0);
function range(){const a=$('#from').value,b=$('#to').value;return DATA.daily.filter(x=>x.date>=a&&x.date<=b)}
function aggregate(rows){const sales=sum(rows,'sales'),net=rows.some(x=>x.net==null)?null:sum(rows,'net');return{sales,payout:sum(rows,'payout'),tax:sum(rows,'tax'),cogs:sum(rows,'cogs'),net,units:sum(rows,'units'),commission:sum(rows,'commission'),logistics:sum(rows,'logistics'),ads:sum(rows,'ads'),storage:sum(rows,'storage'),returns:sum(rows,'returns'),other:sum(rows,'other'),margin_pct:net!=null&&sales?net/sales*100:null,avg_price:sum(rows,'units')?sales/sum(rows,'units'):0}}
function previous(rows){if(!rows.length)return[];const first=new Date(rows[0].date+'T12:00:00'),days=rows.length,end=new Date(first);end.setDate(end.getDate()-1);const start=new Date(end);start.setDate(start.getDate()-days+1);const iso=d=>d.toISOString().slice(0,10);return DATA.daily.filter(x=>x.date>=iso(start)&&x.date<=iso(end))}
function delta(cur,prev,invert=false){if(prev==null||!isFinite(prev)||prev===0)return'<span class="neutral">нет базы сравнения</span>';const d=(cur-prev)/Math.abs(prev)*100,good=invert?d<=0:d>=0;return`<span class="${good?'up':'down'}">${d>=0?'↑':'↓'} ${Math.abs(d).toFixed(1)}% к пред. периоду</span>`}
function renderKpis(rows){const c=aggregate(rows),p=aggregate(previous(rows));const cards=[
 ['Чистая прибыль',money(c.net),c.net==null?'<span class="down">нет себестоимости</span>':delta(c.net,p.net),'net'],
 ['Маржа',c.margin_pct==null?'—':c.margin_pct.toFixed(2)+'%',delta(c.margin_pct,p.margin_pct),'margin_pct'],
 ['Продажи',money(c.sales),delta(c.sales,p.sales),'sales'],
 ['Продано',fmt.format(c.units)+' шт',delta(c.units,p.units),'units'],
 ['Выплата Ozon',money(c.payout),delta(c.payout,p.payout),'payout'],
 ['Себестоимость',money(c.cogs),delta(c.cogs,p.cogs,true),'cogs'],
 ['Логистика',money(Math.abs(c.logistics)),delta(Math.abs(c.logistics),Math.abs(p.logistics),true),'logistics'],
 ['Реклама / ДРР',money(Math.abs(c.ads))+' · '+(c.sales?Math.abs(c.ads)/c.sales*100:0).toFixed(2)+'%',delta(Math.abs(c.ads),Math.abs(p.ads),true),'ads']
 ];$('#kpis').innerHTML=cards.map(x=>`<article class="card kpi"><div class="kpi-name">${x[0]}<span>ⓘ</span></div><div class="kpi-value">${x[1]}</div><div class="delta">${x[2]}</div></article>`).join('');return c}
function renderChart(rows){if(!rows.length){$('#chart').innerHTML='<div class="empty">Нет данных за период</div>';return}const vals=rows.map(x=>x.net||0),W=760,H=230,pad=28,min=Math.min(0,...vals),max=Math.max(0,...vals),span=max-min||1,x=i=>pad+i*(W-pad*2)/Math.max(1,vals.length-1),y=v=>pad+(max-v)*(H-pad*2)/span;const points=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' '),area=`${pad},${y(0)} ${points} ${x(vals.length-1)},${y(0)}`;let grid='';for(let i=0;i<5;i++){const v=min+(max-min)*i/4,yy=y(v);grid+=`<line class="${Math.abs(v)<.01?'zero':'axis'}" x1="${pad}" y1="${yy}" x2="${W-pad}" y2="${yy}"/><text class="tick" x="0" y="${yy+3}">${fmt.format(v)}</text>`}const labels=[0,Math.floor((rows.length-1)/2),rows.length-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text class="tick" x="${x(i)-14}" y="${H-2}">${rows[i].date.slice(5)}</text>`).join('');$('#chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1267ef" stop-opacity=".22"/><stop offset="1" stop-color="#1267ef" stop-opacity=".01"/></linearGradient></defs>${grid}<polygon class="area" points="${area}"/><polyline class="line" points="${points}"/>${labels}</svg>`}
function renderBreakdown(c){const items=[['Себестоимость',c.cogs],['Комиссия',Math.abs(c.commission)],['Логистика',Math.abs(c.logistics)],['Реклама',Math.abs(c.ads)],['Прочее',Math.abs(c.storage)+Math.abs(c.returns)+Math.abs(c.other)+c.tax]],max=Math.max(...items.map(x=>x[1]),1);$('#breakdown').innerHTML=items.map(x=>`<div class="bar"><div class="bar-head"><span>${x[0]}</span><b>${money(x[1])}</b></div><div class="bar-track"><div class="bar-fill" style="width:${x[1]/max*100}%"></div></div></div>`).join('')}
function renderSkus(rows){const map={};for(const d of rows)for(const s of d.by_sku||[]){const x=map[s.sku]||(map[s.sku]={...s,units:0,revenue:0,payout:0,cogs:0,net:0,hasNet:true});x.units+=s.units;x.revenue+=s.revenue;x.payout+=s.payout;x.cogs+=s.cogs;if(s.net==null)x.hasNet=false;else x.net+=s.net}const out=Object.values(map).sort((a,b)=>b.revenue-a.revenue);$('#skuCount').textContent=out.length+' SKU';$('#skuRows').innerHTML=out.length?out.map(s=>{const margin=s.hasNet&&s.revenue?s.net/s.revenue*100:null;return`<tr><td><div class="product">${s.image?`<img src="${s.image}" loading="lazy">`:''}<div><div class="pname">${s.name||('SKU '+s.sku)}</div><div class="offer">${s.offer_id||''} · ${s.sku}</div></div></div></td><td>${fmt.format(s.units)}</td><td>${money(s.revenue)}</td><td>${money(s.payout)}</td><td>${money(s.cogs)}</td><td class="${s.net>=0?'pos':'neg'}">${s.hasNet?money(s.net):'—'}</td><td class="${margin>=0?'pos':'neg'}">${margin==null?'—':margin.toFixed(2)+'%'}</td></tr>`}).join(''):'<tr><td colspan="7" class="empty">Нет продаж за период</td></tr>'}
function renderStocks(){const rows=(DATA.stocks||{}).recommendations||[];$('#stocks').innerHTML=rows.length?rows.slice(0,24).map(x=>`<article class="stock"><div class="stock-top"><strong>${x.offer_id||x.name}</strong><span class="badge">${x.cluster}</span></div><div class="stock-metric">+${fmt.format(x.supply_qty)} шт</div><small>сейчас ${fmt.format(x.stock)} шт · ${x.days_left==null?'нет продаж':x.days_left+' дн'} · спрос ${x.ads.toFixed(1)}/день</small></article>`).join(''):'<div class="empty">Нет дефицитных направлений по данным Ozon</div>'}
function render(){const rows=range(),c=renderKpis(rows);renderChart(rows);renderBreakdown(c);renderSkus(rows)}
function setPreset(v){const all=DATA.daily;if(!all.length)return;const end=new Date(all.at(-1).date+'T12:00:00'),first=new Date(all[0].date+'T12:00:00'),start=new Date(end);if(v==='all')start.setTime(first);else if(v==='mtd')start.setDate(1);else start.setDate(start.getDate()-Number(v)+1);if(start<first)start.setTime(first);$('#from').value=start.toISOString().slice(0,10);$('#to').value=end.toISOString().slice(0,10);document.querySelectorAll('.preset').forEach(b=>b.classList.toggle('active',b.dataset.days===v));render()}
fetch('data.json?'+Date.now()).then(r=>{if(!r.ok)throw Error('data.json '+r.status);return r.json()}).then(d=>{DATA=d;$('#updated').textContent='Обновлено '+new Date(d.generated_at).toLocaleString('ru-RU');const q=d.quality||{},bad=q.status!=='verified';$('#quality').textContent=bad?'⚠ Неполная себестоимость':'✓ Цифры проверены';$('#quality').classList.toggle('bad',bad);if(bad){$('#alert').className='alert show';$('#alert').textContent='Чистая прибыль скрыта: у '+q.missing_cogs.length+' SKU не заполнена себестоимость. Продажи и начисления показаны, но итог не публикуется.'}$('#formulas').innerHTML=Object.entries(d.formula||{}).map(([k,v])=>`<div class="formula"><b>${k}</b>${v}</div>`).join('');renderStocks();setPreset('30')}).catch(e=>{$('#alert').className='alert show';$('#alert').textContent='Не удалось загрузить данные: '+e.message});
document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>setPreset(b.dataset.days));$('#from').onchange=render;$('#to').onchange=render;
</script>
</body>
</html>
